name: Release backend

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-trigger/v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'FelipePn10/venturerp'
    runs-on: ubuntu-latest
    env:
      # Raise only in an intentional compatibility-breaking PR. Backend patch
      # releases must not lock out already-installed desktop 1.0.1 clients.
      MIN_CLIENT_VERSION: "1.1.11"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME##*/}"
          version="${tag#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            MIN_CLIENT_VERSION=${{ env.MIN_CLIENT_VERSION }}
          tags: |
            ghcr.io/felipepn10/panossoerp:${{ github.ref_name }}
            ghcr.io/felipepn10/panossoerp:latest

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/felipepn10/panossoerp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create tag for remote release request
        if: startsWith(github.ref, 'refs/heads/release-trigger/')
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "VentureERP ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            printf 'GitHub release %s already exists; keeping it.\n' "${tag}"
          else
            gh release create "${tag}" --verify-tag --generate-notes --title "VentureERP ${tag}"
          fi
