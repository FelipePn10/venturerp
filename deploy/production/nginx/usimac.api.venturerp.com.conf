# API da Usimac — usimac.api.venturerp.com → 127.0.0.1:5075
#
# Instale como /etc/nginx/sites-available/venturerp-usimac e ative com um link em
# sites-enabled. Este arquivo cobre só o HTTP na porta 80; o bloco TLS é escrito
# pelo certbot:
#
#   1. registro A de usimac.api.venturerp.com apontando para esta VPS
#      (o domínio tem um curinga *.venturerp.com para a Vercel; o registro
#       específico é o que traz este subdomínio para cá)
#   2. sudo ln -s /etc/nginx/sites-available/venturerp-usimac /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d usimac.api.venturerp.com
#
# Para o próximo cliente, copie este arquivo trocando subdomínio e porta.

server {
    listen 80;
    listen [::]:80;
    server_name usimac.api.venturerp.com;

    # O corpo grande vem de importação de XML e anexo de documento. O limite real
    # é do backend (MAX_BODY_BYTES); aqui fica uma folga para o 413 chegar da API
    # com mensagem em português, em vez de um 413 cru do nginx.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5075;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A emissão fiscal e os relatórios longos passam de um minuto: o padrão de
        # 60s do nginx cortaria a resposta no meio e o cliente veria 504 sem saber
        # se a nota foi autorizada.
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
