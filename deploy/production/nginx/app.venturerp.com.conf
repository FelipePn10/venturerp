# Portal do aplicativo — app.venturerp.com
#
# Serve três coisas estáticas, nenhuma delas com dado de cliente:
#
#   /                     página de download que o cliente recebe da Venture
#   /tenants.json         catálogo domínio de e-mail → endereço da API
#   /updates/latest.json  canal de atualização automática do desktop
#
# Instale como /etc/nginx/sites-available/venturerp-app, ative com link em
# sites-enabled e emita o certificado:
#
#   1. registro A de app.venturerp.com apontando para esta VPS
#   2. sudo install -d -o www-data -g www-data -m 0755 /var/www/venture-app/updates
#   3. sudo ln -s /etc/nginx/sites-available/venturerp-app /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d app.venturerp.com

server {
    listen 80;
    listen [::]:80;
    server_name app.venturerp.com;

    root /var/www/venture-app;
    index index.html;

    # O catálogo decide para qual servidor o app manda e-mail e senha. Cache curto
    # para que a entrada de um cliente novo valha em minutos, e não no dia seguinte.
    location = /tenants.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Manifesto do updater do Tauri. Sem cache: uma cópia velha aqui é um cliente
    # que não recebe a correção que acabou de sair.
    location = /updates/latest.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Instaladores. Imutáveis por versão — o nome carrega a versão.
    location /downloads/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        # Força o download em vez de o navegador tentar interpretar o arquivo.
        add_header Content-Disposition "attachment";
        types {
            application/octet-stream exe msi;
            application/octet-stream sig;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
